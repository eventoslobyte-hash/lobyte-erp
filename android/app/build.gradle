apply plugin: 'com.android.application'

// URL de producción que la app nativa envuelve (Trusted Web Activity).
// IMPORTANTE: reemplazá esto por tu dominio real de Vercel (o dominio propio)
// una vez que esté desplegado — ver README, sección 13.
def HOST = "lobyte-erp.vercel.app"

android {
    namespace 'com.lobyte.erp'
    compileSdk 34

    defaultConfig {
        applicationId "com.lobyte.erp"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"

        manifestPlaceholders = [
            hostName: HOST,
            defaultUrl: "https://" + HOST,
            assetStatements: "[{ \"relation\": [\"delegate_permission/common.handle_all_urls\"], " +
                "\"target\": {\"namespace\": \"web\", \"site\": \"https://" + HOST + "\"} }]"
        ]
    }

    // Firma fija (no cambia entre builds) generada una única vez para este
    // proyecto, así el fingerprint SHA-256 en public/.well-known/assetlinks.json
    // no se rompe cada vez que GitHub Actions compila una versión nueva, y las
    // actualizaciones de la app se pueden instalar encima sin desinstalar antes.
    // No es una clave "de producción" en el sentido de Play Store — para publicar
    // en Play Store en el futuro, generá tu propia keystore (ver README).
    signingConfigs {
        release {
            storeFile file("../keystore/lobyte-release.keystore")
            storePassword "lobyte2026"
            keyAlias "lobyte"
            keyPassword "lobyte2026"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
